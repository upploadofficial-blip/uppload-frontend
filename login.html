<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UppLoad — Sign In</title>
<style>
  :root{
    --ink:#151313;
    --paper:#FBF7F0;
    --card:#FFFFFF;
    --marigold:#E8722C;
    --indigo:#1F2A44;
    --line:#E7E0D4;
    --muted:#7A7268;
    --chipbg:#F1ECE1;
    --danger:#D64545;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .auth-card{
    background:var(--card);
    width:100%;
    max-width:400px;
    border-radius:20px;
    padding:36px 30px;
    box-shadow:0 8px 30px rgba(0,0,0,0.06);
  }
  .logo{
    text-align:center;
    font-size:26px;
    font-weight:800;
    color:var(--indigo);
    margin-bottom:6px;
  }
  .logo span{color:var(--marigold);}
  .tagline{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .api-status{
    text-align:center;
    font-size:11.5px;
    padding:6px 10px;
    border-radius:8px;
    margin-bottom:20px;
  }
  .api-status.online{background:#E8F5E9; color:#2E7D32;}
  .api-status.offline{background:#FDECEA; color:#C62828;}

  .tabs{
    display:flex;
    background:var(--chipbg);
    border-radius:14px;
    padding:4px;
    margin-bottom:24px;
  }
  .tab-btn{
    flex:1;
    text-align:center;
    padding:9px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:14px;
    outline:none;
    font-family:inherit;
  }
  .field input:focus{border-color:var(--marigold);}
  .name-row{display:flex; gap:10px;}
  .name-row .field{flex:1;}
  .signup-only{display:none;}
  .signup-only.show{display:block;}

  .error-box{
    display:none;
    background:#FDECEA;
    color:#C62828;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:14px;
  }
  .error-box.show{display:block;}

  .primary-btn{
    width:100%;
    background:var(--marigold);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .primary-btn:disabled{opacity:0.6; cursor:not-allowed;}

  .success-screen{display:none; text-align:center; padding:20px 0;}
  .success-screen.show{display:block;}
  .success-icon{
    width:64px; height:64px;
    border-radius:50%;
    background:#E8F5E9;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 16px;
  }
  .success-icon svg{width:28px; height:28px; fill:#2E7D32;}
  .success-title{font-size:17px; font-weight:700; margin-bottom:6px;}
  .success-sub{font-size:13px; color:var(--muted); margin-bottom:4px;}
  .token-box{
    margin-top:16px;
    background:var(--chipbg);
    border-radius:10px;
    padding:12px;
    font-size:10.5px;
    color:var(--muted);
    word-break:break-all;
    text-align:left;
  }
</style>
<script src="config.js"></script>
</head>
<body>
<div style="display:flex; gap:14px; padding:10px 20px; background:#1F2A44; overflow-x:auto; white-space:nowrap;">
  <a href="index.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">Home</a>
  <a href="shorts.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">Shorts</a>
  <a href="upload.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">Upload</a>
  <a href="subscriptions.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">Subscriptions</a>
  <a href="you.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">You</a>
  <a href="login.html" style="color:#fff; text-decoration:none; font-size:12.5px; font-weight:600;">Sign In</a>
</div>

<div class="auth-card" id="authCard">
  <div class="logo">UppLoad<span>.</span></div>
  <div class="tagline">India's own video platform</div>
  <div class="api-status" id="apiStatus">Checking backend connection...</div>

  <div class="tabs">
    <div class="tab-btn active" id="loginTab">Sign In</div>
    <div class="tab-btn" id="signupTab">Create Account</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <form id="authForm">
    <div class="signup-only" id="nameFields">
      <div class="name-row">
        <div class="field">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="Rahul">
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Anand">
        </div>
      </div>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <button type="submit" class="primary-btn" id="submitBtn">Sign In</button>
  </form>
</div>

<div class="auth-card success-screen" id="successScreen">
  <div class="success-icon">
    <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
  </div>
  <div class="success-title" id="successTitle">Signed in successfully</div>
  <div class="success-sub" id="successSub">Welcome to UppLoad</div>
  <div class="token-box" id="tokenBox"></div>
</div>

<script>
  // ⚠️ This points to your local backend. If you deploy the backend online,
  // change this to your live server's URL (e.g. https://your-app.onrender.com)
  const API_BASE = CONFIG.API_BASE;

  const apiStatus = document.getElementById('apiStatus');
  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
  const nameFields = document.getElementById('nameFields');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const authForm = document.getElementById('authForm');

  // Check if backend is reachable
  fetch(API_BASE + '/')
    .then(r => r.json())
    .then(() => {
      apiStatus.textContent = '● Connected to UppLoad backend';
      apiStatus.className = 'api-status online';
    })
    .catch(() => {
      apiStatus.textContent = '● Backend not running — start it with "npm start" first';
      apiStatus.className = 'api-status offline';
    });

  function setMode(mode){
    errorBox.classList.remove('show');
    if(mode === 'signup'){
      loginTab.classList.remove('active');
      signupTab.classList.add('active');
      nameFields.classList.add('show');
      submitBtn.textContent = 'Create Account';
    } else {
      signupTab.classList.remove('active');
      loginTab.classList.add('active');
      nameFields.classList.remove('show');
      submitBtn.textContent = 'Sign In';
    }
  }
  loginTab.addEventListener('click', () => setMode('login'));
  signupTab.addEventListener('click', () => setMode('signup'));

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const isSignup = signupTab.classList.contains('active');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if(!email || !password){
      showError('Please fill in email and password.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait...';

    try{
      let response, data;
      if(isSignup){
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        if(!firstName || !lastName){
          showError('Please fill in your first and last name.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }
        response = await fetch(API_BASE + '/api/auth/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ firstName, lastName, email, password })
        });
      } else {
        response = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
      }

      data = await response.json();

      if(!response.ok){
        showError(data.error || 'Something went wrong.');
        submitBtn.disabled = false;
        submitBtn.textContent = isSignup ? 'Create Account' : 'Sign In';
        return;
      }

      // Real success — save the real token from the real backend
      localStorage.removeItem('uppload_token'); // not used across pages in this demo, just showing the flow
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('successTitle').textContent = data.message;
      document.getElementById('successSub').textContent = `Signed in as ${data.user.channelName} (${data.user.email})`;
      document.getElementById('tokenBox').textContent = 'Real session token from the server: ' + data.token;
      document.getElementById('successScreen').classList.add('show');

    } catch(err){
      showError('Could not reach the backend. Is it running on ' + API_BASE + '?');
      submitBtn.disabled = false;
      submitBtn.textContent = isSignup ? 'Create Account' : 'Sign In';
    }
  });
</script>

</body>
</html>
